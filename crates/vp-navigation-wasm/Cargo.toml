[package]
name = "vp-navigation-wasm"
version = "0.1.0"
edition = "2021"
description = "WebAssembly bindings for vp-navigation"
license = "MIT"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
vp-navigation = { path = "../vp-navigation" }
wasm-bindgen = "0.2"

[package.metadata.wasm-pack.profile.release]
wasm-opt = false
