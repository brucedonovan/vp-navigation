<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>The Long Room — vp-navigation</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,460;9..144,560&family=Outfit:wght@360;500&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <header class="top">
      <p class="brand">vp-navigation</p>
      <p class="piece">The Long Room</p>
      <p class="howto">Wheel · arrows · swipe</p>
    </header>
    <main id="stage"></main>
    <footer class="dock">
      <p class="station" id="station" aria-hidden="true"></p>
      <div class="dock-actions">
        <button type="button" id="branch" hidden>Enter the Annex</button>
        <button type="button" id="back" hidden>Return</button>
        <button type="button" id="motion" aria-pressed="false">Reduce motion</button>
      </div>
    </footer>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
